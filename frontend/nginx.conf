server {
    listen 80;
    server_name  localhost;

    # Everything shadow-cljs outputs here (index.html, js/main.js) is
    # unhashed — the filename never changes between builds, only its
    # content does. Without an explicit Cache-Control, browsers apply their
    # own heuristic caching and can keep serving an old cached copy
    # indefinitely, with no way to tell it's stale. no-cache forces a
    # revalidation (a cheap conditional request using the file's ETag) on
    # every load, so a rebuild is always picked up on the next refresh.
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
